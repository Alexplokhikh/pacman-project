name: Main Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: myapps/pacman
  IMAGE_TAG: ${{ github.sha }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: eu-central-1

permissions:
  contents: read
  id-token: write
jobs:
  cicd:
    name: Deploy using aws eks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{env.AWS_REGION}}

      - name: Confirm aws credentials
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push a Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --no-cache -f docker/Dockerfile -t $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}} .
          echo "Docker image built successfully: $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}}"
          docker push $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}}
          echo "Docker image pushed successfully: $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}}"

      - name: configure eks access
        run: |
          aws eks update-kubeconfig --region eu-central-1 --name pacman-cluster

      - name: Update Kubernetes Deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl apply -f k8s/storage-class.yaml
          kubectl apply -f k8s/db-sts.yaml
          kubectl apply -f k8s/app-deployment.yaml
          echo "Docker image used: $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}}"
          kubectl set image deployment/pacman-app pacman=${{env.ACCOUNT_ID}}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}}
          kubectl rollout status deployment pacman-app
          kubectl rollout status statefulset mongo
          kubectl get services pacman-service
