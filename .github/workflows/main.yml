name: Main Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
jobs:
  cicd:
    name: Deploy using aws eks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Confirm aws credentials
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push a Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myapps/pacman
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -f docker/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Docker image built successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Docker image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: configure eks access
        run: |
          aws eks update-kubeconfig --region eu-central-1 --name pacman-cluster

      - name: Update Kubernetes Deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myapps/pacman
          IMAGE_TAG: ${{ github.sha }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          kubectl apply -f k8s/storage-class.yaml
          kubectl apply -f k8s/db-sts.yaml
          kubectl apply -f k8s/app-deployment.yaml
          echo "Docker image used: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl set image deployment/pacman-app pacman=$ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          kubectl rollout status deployment pacman-app
          kubectl rollout status statefulset mongo
          kubectl get services pacman-service
